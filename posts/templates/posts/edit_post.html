{% extends 'base.html' %}

{% block title %}Редактировать публикацию | SocialMedia{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-4 mt-5" style="border-radius: 16px; background-color: var(--bs-body-bg);">
            <h4 class="fw-bold mb-4">Редактировать публикацию</h4>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="mb-3">
                    {{ form.content }}
                </div>
                
                <div class="mb-4">
                    <label class="form-label text-muted small">Картинка</label>
                    {% if post.image %}
                        <div class="mb-2">
                            <img src="{{ post.image.url }}" class="img-fluid rounded-3" style="max-height: 150px; object-fit: cover;" alt="Current image">
                        </div>
                    {% endif %}
                    {{ form.image }}
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary rounded-pill px-4 flex-fill">Сохранить</button>
                    <a href="{% url 'feed' %}" class="btn btn-outline-secondary rounded-pill px-4">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
