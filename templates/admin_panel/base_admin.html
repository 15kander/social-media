<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Панель управления</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121418; color: #e9ecef; }
        .sidebar { background-color: #1a1d21 !important; border-right: 1px solid #2d3238; }
        .card { background-color: #1a1d21; border: 1px solid #2d3238; }
        .table { color: #e9ecef; border-color: #2d3238; }
        .nav-link.active, .nav-link:hover { background-color: #2b3035; border-radius: 6px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary px-3">
        <a class="navbar-brand fw-bold text-info" href="{% url 'admin_dashboard' %}">⚡ CyberAdmin</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link btn btn-outline-secondary btn-sm px-3 text-light me-2" href="{% url 'feed' %}">На сайт</a>
            <a class="nav-link btn btn-outline-danger btn-sm px-3" href="{% url 'logout' %}">Выйти</a>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse py-4" style="min-height: 92vh;">
                <ul class="nav flex-column gap-2 px-2">
                    <li class="nav-item"><a class="nav-link text-light" href="{% url 'admin_dashboard' %}">📊 Главная</a></li>
                    <li class="nav-item"><a class="nav-link text-light" href="{% url 'admin_users' %}">👥 Пользователи</a></li>
                    <li class="nav-item"><a class="nav-link text-light" href="{% url 'admin_posts' %}">📝 Посты</a></li>
                    <li class="nav-item"><a class="nav-link text-light" href="{% url 'admin_comments' %}">💬 Комментарии</a></li>
                    <li class="nav-item"><a class="nav-link text-light" href="{% url 'admin_blocks' %}">🚫 Блокировки</a></li>
                </ul>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
