{% extends 'base.html' %}

{% block title %}Редактирование профиля | SocialMedia{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm p-4 mt-5">
            <h3 class="mb-4 text-center">Редактировать профиль</h3>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ u_form.as_p }}
                {{ p_form.as_p }}
                <button type="submit" class="btn btn-primary w-100 mt-3">Сохранить изменения</button>
            </form>
            
            <a href="{% url 'profile' user.username %}" class="btn btn-link w-100 mt-3 text-decoration-none">Назад в профиль</a>
        </div>
    </div>
</div>
{% endblock %}
