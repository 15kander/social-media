{% extends 'base.html' %}

{% block title %}Вход | SocialMedia{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold mb-3 text-center">Вход в аккаунт</h3>
            
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 rounded-pill mt-3 py-2">Войти</button>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted small">Еще нет аккаунта?</span> 
                <a href="{% url 'register' %}" class="text-decoration-none fw-bold" style="color: var(--ig-purple);">Зарегистрироваться</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
